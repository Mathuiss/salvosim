[scenario]
name = "Operation Steel Hammer (saturation)"
description = "A saturated 5-wave strike: decoys and SEAD degrade the IADS, then precision weapons destroy the bunker."
iterations = 5000

# ── DEFENDERS ─────────────────────────────────────────────────────
# Layered Russian IADS protecting a hardened command bunker.
# The attacker must degrade each layer before the facility becomes reachable.

[[defenders]]
name = "Protected Facility"
staying_power = 8
magazine_depth = 0
max_engagement_capacity = 0
doctrine = "shoot-look-shoot"
pkd = { type = "fixed", value = 0.0 }

[[defenders]]
name = "S-400 Triumf (Long-Range SAM)"
staying_power = 5
magazine_depth = 48
max_engagement_capacity = 12
doctrine = "shoot-look-shoot"
pkd = { type = "uniform_range", min = 0.75, max = 0.90 }

[[defenders]]
name = "S-300VM Antey-2500 (Long-Range SAM)"
staying_power = 4
magazine_depth = 36
max_engagement_capacity = 10
doctrine = "shoot-look-shoot"
pkd = { type = "uniform_range", min = 0.65, max = 0.85 }

[[defenders]]
name = "Buk-M3 (Medium-Range SAM)"
staying_power = 3
magazine_depth = 24
max_engagement_capacity = 8
doctrine = "shoot-look-shoot"
pkd = { type = "uniform_range", min = 0.60, max = 0.80 }

[[defenders]]
name = "Tor-M2 (Short-Range SAM)"
staying_power = 2
magazine_depth = 16
max_engagement_capacity = 8
doctrine = "max_defense"
pkd = { type = "uniform_range", min = 0.65, max = 0.85 }

[[defenders]]
name = "Pantsir-S1 (Close Defense)"
staying_power = 2
magazine_depth = 12
max_engagement_capacity = 6
doctrine = "shoot-look-shoot"
pkd = { type = "uniform_range", min = 0.50, max = 0.70 }

[[defenders]]
name = "Pantsir-S1 (Facility Perimeter)"
staying_power = 2
magazine_depth = 12
max_engagement_capacity = 6
doctrine = "shoot-look-shoot"
pkd = { type = "uniform_range", min = 0.50, max = 0.70 }

# ── ATTACKERS ─────────────────────────────────────────────────────
# Cost-effective 4-wave strike. Each wave degrades the IADS further,
# so later waves need fewer missiles — more get through as defenses thin.

# ── Wave 1 — Saturation & Suppression (48 missiles, 0 to bunker) ─
# Cheap decoys soak up S-400 ammo. SEAD flights suppress radar emissions.
# The defender expends many interceptors on near-zero-value targets.

[[attackers]]
name = "ADM-160 MALD Decoys"
target_name = "S-400 Triumf (Long-Range SAM)"
salvo_schedule = [16, 0, 0, 0, 0]
pko = { type = "fixed", value = 0.0 }

[[attackers]]
name = "F-16CJ SEAD Flight (HARM)"
target_name = "S-400 Triumf (Long-Range SAM)"
salvo_schedule = [8, 0, 0, 0, 0]
pko = { type = "fixed", value = 0.70 }

[[attackers]]
name = "F-35A SEAD (JSM)"
target_name = "S-300VM Antey-2500 (Long-Range SAM)"
salvo_schedule = [4, 0, 0, 0, 0]
pko = { type = "normal_distribution", mean = 0.85, std_dev = 0.05 }

[[attackers]]
name = "UAV Strike Swarm (Small Munitions)"
target_name = "Buk-M3 (Medium-Range SAM)"
salvo_schedule = [20, 0, 0, 0, 0]
pko = { type = "fixed", value = 0.40 }

# ── Wave 2 — IADS Degradation (28 missiles, 6 to bunker) ─────────
# Cruise missile salvo overwhelms the outer SAM layer.
# B-1B ripples the first JASSMs at the bunker while defences are still occupied.

[[attackers]]
name = "B-52H Stratofortress (JASSM-ER)"
target_name = "S-400 Triumf (Long-Range SAM)"
salvo_schedule = [0, 12, 0, 0, 0]
pko = { type = "normal_distribution", mean = 0.80, std_dev = 0.06 }

[[attackers]]
name = "Tomahawk Salvo (Surface Ships)"
target_name = "S-300VM Antey-2500 (Long-Range SAM)"
salvo_schedule = [0, 8, 0, 0, 0]
pko = { type = "fixed", value = 0.80 }

[[attackers]]
name = "F/A-18E Strike Flight (JSOW)"
target_name = "Buk-M3 (Medium-Range SAM)"
salvo_schedule = [0, 8, 0, 0, 0]
pko = { type = "normal_distribution", mean = 0.75, std_dev = 0.07 }

[[attackers]]
name = "B-1B Lancer (JASSM)"
target_name = "Protected Facility"
salvo_schedule = [0, 6, 4, 4, 2]
pko = { type = "normal_distribution", mean = 0.80, std_dev = 0.05 }

# ── Wave 3 — Breakthrough & Facility Strike (22 missiles, 10 to bunker) ─
# ATACMS and SDB suppress the inner Tor-M2 and Pantsir layers.
# With defences weakened, fewer strike missiles are needed to hit the bunker.

[[attackers]]
name = "MGM-140 ATACMS Battery"
target_name = "Tor-M2 (Short-Range SAM)"
salvo_schedule = [0, 0, 8, 0, 0]
pko = { type = "fixed", value = 0.85 }

[[attackers]]
name = "F-15E Strike Flight (SDB)"
target_name = "Pantsir-S1 (Close Defense)"
salvo_schedule = [0, 0, 8, 0]
pko = { type = "normal_distribution", mean = 0.75, std_dev = 0.08 }

[[attackers]]
name = "F-35A Strike (GBU-53/B)"
target_name = "Protected Facility"
salvo_schedule = [0, 0, 6, 0, 0]
pko = { type = "normal_distribution", mean = 0.85, std_dev = 0.05 }

# ── Wave 4 — Re-strike & Mop-up (8 missiles, 4 to bunker) ─────────
# Minimal follow-up. Defences are mostly exhausted, so few missiles needed.

[[attackers]]
name = "F/A-18E Follow-Up (JSOW)"
target_name = "Protected Facility"
salvo_schedule = [0, 0, 0, 4, 2]
pko = { type = "normal_distribution", mean = 0.75, std_dev = 0.07 }

[[attackers]]
name = "F-16 Follow-Up (JASSM)"
target_name = "Protected Facility"
salvo_schedule = [0, 0, 0, 4, 2]
pko = { type = "normal_distribution", mean = 0.80, std_dev = 0.05 }

[[attackers]]
name = "Tomahawk Salvo (Submarine)"
target_name = "Pantsir-S1 (Facility Perimeter)"
salvo_schedule = [0, 0, 0, 4, 0]
pko = { type = "fixed", value = 0.80 }
